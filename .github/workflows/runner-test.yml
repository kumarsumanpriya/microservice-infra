name: Self Hosted Runner Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-test:
    name: Verify Windows DevOps Tools
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Check Windows and PowerShell
        shell: powershell
        run: |
          Write-Host "Windows Self-Hosted Runner is working"
          Write-Host "Computer: $env:COMPUTERNAME"
          $PSVersionTable.PSVersion

      - name: Check Git
        shell: powershell
        run: |
          git --version

      - name: Check Terraform
        shell: powershell
        run: |
          terraform --version
          if ($LASTEXITCODE -ne 0) {
            throw "Terraform check failed"
          }

      - name: Check TFLint
        shell: powershell
        run: |
          tflint --version
          if ($LASTEXITCODE -ne 0) {
            throw "TFLint check failed"
          }

      - name: Check tfsec
        shell: powershell
        run: |
          tfsec --version
          if ($LASTEXITCODE -ne 0) {
            throw "tfsec check failed"
          }

      - name: Check Checkov
        shell: powershell
        run: |
          checkov --version
          if ($LASTEXITCODE -ne 0) {
            throw "Checkov check failed"
          }

      - name: Check Azure CLI
        shell: powershell
        run: |
          az --version
          if ($LASTEXITCODE -ne 0) {
            throw "Azure CLI check failed"
          }
